[tool.uv.workspace]
members = ["packages/*"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pre-commit", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "PT", "PTH", "TID", "ANN"]
ignore = ["ANN401"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]
"scripts/**" = []

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --doctest-modules"
markers = ["gpu: needs CUDA (local only)"]
