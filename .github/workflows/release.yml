name: release

# Never triggered by the initial scaffold: only a push of a tag matching <name>-v<X.Y.Z> starts this.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish partway through

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse the tag into a package name and version
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            echo "::error::tag '$TAG' does not match '<name>-v<X.Y.Z>'"
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag version matches the package version
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          module="dfwb_torch_${PACKAGE//-/_}"
          init="packages/$PACKAGE/src/$module/__init__.py"
          if [ ! -f "$init" ]; then
            echo "::error::no such package init file: $init"
            exit 1
          fi
          pkg_version=$(grep -m1 -oP '(?<=^__version__ = ")[^"]+' "$init" || true)
          if [ -z "$pkg_version" ]; then
            echo "::error::could not find __version__ in $init"
            exit 1
          fi
          if [ "$pkg_version" != "$TAG_VERSION" ]; then
            echo "::error::tag version '$TAG_VERSION' does not match package __version__ '$pkg_version'"
            exit 1
          fi
          echo "tag version matches package __version__: $pkg_version"

  build:
    name: build
    needs: resolve
    uses: dfwb-research/.github/.github/workflows/python-build.yml@v1
    with:
      package: dfwb-torch-${{ needs.resolve.outputs.package }}

  publish:
    name: publish
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  release:
    name: github-release
    needs: [resolve, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ needs.resolve.outputs.package }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "dfwb-torch-${PACKAGE} ${VERSION}" \
            --notes "Release of dfwb-torch-${PACKAGE} ${VERSION}."
